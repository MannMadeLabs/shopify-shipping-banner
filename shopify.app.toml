# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5330dac03565451296a89b38cade865e"
name = "Shipping Progress Banner"
handle = "shipping-progress-banner"

# Hosted on Railway.app
# UPDATE: Replace with your actual Railway URL after deployment
application_url = "https://shopify-shipping-banner.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # Order tracking for billing limits
  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  # Subscription status updates
  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app/subscriptions_update"

  # Shop updates (currency changes, etc.)
  [[webhooks.subscriptions]]
  topics = [ "shop/update" ]
  uri = "/webhooks/shop/update"

  # Note: GDPR webhooks (customers/data_request, customers/redact, shop/redact)
  # are automatically configured by Shopify when you provide the endpoints
  # They don't need to be declared in shopify.app.toml

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Added read_orders for order count tracking
scopes = "read_products,read_orders"

[auth]
redirect_urls = [ "https://shopify-shipping-banner.up.railway.app/auth/callback" ]

[app_proxy]
# App Proxy for storefront API requests
url = "https://shopify-shipping-banner.up.railway.app/api/proxy"
prefix = "apps"
subpath = "shipping-bar"
