# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5330dac03565451296a89b38cade865e"
name = "Shipping Progress Banner"
application_url = "https://shopify-shipping-banner.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # Note: GDPR webhooks (customers/data_request, customers/redact, shop/redact)
  # are automatically configured by Shopify when you provide the endpoints
  # They don't need to be declared in shopify.app.toml

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products"

[auth]
redirect_urls = [ "https://shopify-shipping-banner.onrender.com/api/auth" ]
